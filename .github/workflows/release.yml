name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Run snapshot build only (dry-run without publishing)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify: # TODO(release): Remove this once we adopt GitFlow.
    name: Verify Tests and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.64.5
          args: --timeout=5m ./cmd/... ./internal/...

      - name: Run tests
        run: |
          go test -v -race ./internal/...

  release:
    name: Publish Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ inputs.snapshot && 'release --snapshot --clean --skip=publish' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
